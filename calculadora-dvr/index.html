        .text-white { color: #ffffff; }
        .text-gray-200 { color: #e5e7eb; }
        .text-gray-300 { color: #d1d5db; }

        .text-blue-200 { color: #bfdbfe; }

        }
        .transition-colors {

        }
        .hover\:text-blue-300:hover {
            color: #93c5fd;
        }

        .rounded-lg { border-radius: 0.5rem; }
        .rounded-xl { border-radius: 0.75rem; }
        .rounded-2xl { border-radius: 1.15rem; }
        .rounded-full { border-radius: 9999px; }
        .border { border-width: 1px; }
        .border-t { border-top-width: 1px; }

        /* Componentes personalizados */
        .header-icon-box {
            background: linear-gradient(135deg, #2563eb 0%, #3b82f6 50%, #06b6d4 100%);

            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 1.15rem;
        }

        .title-gradient {
            background: linear-gradient(to right, #ffffff, #bfdbfe);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .btn-calcular {
            background: linear-gradient(to right, #2563eb, #0891b2);
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.4);
        }
        .btn-calcular:hover {
            background: linear-gradient(to right, #3b82f6, #06b6d4);
            box-shadow: 0 0 30px rgba(6, 182, 212, 0.6);
            transform: translateY(-2px);
        }

        .actual-input-highlight {
            border: 1px solid #3b82f6 !important;
            color: #93c5fd !important;
            background-color: rgba(59, 130, 246, 0.1) !important;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.15);
        }

        .dvr-input-highlight {
            border: 1px solid #f59e0b !important; 
            color: #fcd34d !important; 
            background-color: rgba(245, 158, 11, 0.1) !important;
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.2);
        }

        .peticion-input-highlight {
            border: 1px solid #10b981 !important; 
            color: #6ee7b7 !important; 
            background-color: rgba(16, 185, 129, 0.1) !important;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.2);
        }

        /* Selector emergente de Fecha + Hora (Diseño de 3 columnas) */
        .dt-popover {
            background: #0f172a;
            border: 1px solid rgba(59, 130, 246, 0.45);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.9), 0 0 30px rgba(37, 99, 235, 0.25);
            border-radius: 0.75rem;
            z-index: 100;
            max-height: 92vh;
            overflow-y: auto;
        }

        .time-col {
            height: 160px;
            overflow-y: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
            position: relative;
        }
        .time-col.no-loop {
            overflow-y: hidden;
            padding-bottom: 0;
        }
        .time-col::-webkit-scrollbar {
            display: none;
        }

        .time-item {
            height: 36px;
            min-width: 72px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.95rem;
            color: #e2e8f0;
            border-radius: 4px;
            cursor: pointer;
            user-select: none;
            transition: background-color 0.15s, color 0.15s;
            margin-bottom: 2px;
        }
        .time-item:hover {
            background-color: rgba(255, 255, 255, 0.08);
        }
        .time-item.active {
            background-color: #007bff !important;
            color: #ffffff !important;
            font-weight: 700;
            box-shadow: 0 2px 8px rgba(0, 123, 255, 0.45);
        }

        .cal-header-btn {
            background: rgba(30, 41, 59, 0.75);
            border: 1px solid rgba(71, 85, 105, 0.5);
            color: #f8fafc;
            padding: 0.2rem 0.5rem;
            border-radius: 0.375rem;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            transition: all 0.15s;
        }
        .cal-header-btn:hover {
            background: rgba(59, 130, 246, 0.25);
            border-color: #3b82f6;
            color: #67e8f9;
        }

        .year-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 0.375rem;
            max-height: 200px;
            overflow-y: auto;
            padding: 0.25rem;
            scrollbar-width: thin;
        }
        .year-item {
            padding: 0.45rem 0.25rem;
            text-align: center;
            border-radius: 0.375rem;
            font-size: 0.85rem;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            cursor: pointer;
            color: #cbd5e1;
            background: rgba(30, 41, 59, 0.45);
            border: 1px solid transparent;
            transition: all 0.15s;
        }
        .year-item:hover {
            background: rgba(59, 130, 246, 0.25);
            color: #ffffff;
            border-color: rgba(59, 130, 246, 0.4);
        }
        .year-item.selected {
            background: #007bff;
            color: #ffffff;
            font-weight: 700;
            box-shadow: 0 0 10px rgba(0, 123, 255, 0.5);
        }

        .cal-grid-7 {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
        }

        .cal-day {
            width: 32px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            font-size: 0.82rem;
            cursor: pointer;
            transition: all 0.15s;
            margin: 0 auto;
        }
        .cal-day:hover:not(.empty) {
            background-color: rgba(59, 130, 246, 0.25);
            color: #ffffff;
        }
        .cal-day.selected {
            background-color: #007bff;
            color: #ffffff;
            font-weight: 700;
            box-shadow: 0 0 10px rgba(0, 123, 255, 0.5);
        }
        .cal-day.today:not(.selected) {
            border: 1px solid #38bdf8;
            color: #38bdf8;
            font-weight: 600;
        }

        @keyframes ping {
            75%, 100% { transform: scale(2); opacity: 0; }
        }
        @keyframes pulse {
            50% { opacity: .5; }
        }
        .animate-ping { animation: ping 1.2s cubic-bezier(0, 0, 0.2, 1) infinite; }
        .animate-pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }

        .svg-icon {
            display: inline-block;
            width: 1.1em;
            height: 1.1em;
            vertical-align: -0.15em;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex-shrink: 0;
        }

        .result-time-box {

        }

        .btn-limpiar {

            border: 1px solid rgba(239, 68, 68, 0.45);
            padding: 0.5rem 1.25rem;
        }
        .btn-limpiar:hover {
            background: rgba(239, 68, 68, 0.28);
            border-color: rgba(248, 113, 113, 0.8);
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.3);
        }

        .btn-inicio {
            position: fixed;
            top: 1.25rem;
            left: 1.25rem;
            z-index: 40;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.55rem 1rem;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(59, 130, 246, 0.4);
            border-radius: 0.65rem;
            color: #bfdbfe;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4), 0 0 12px rgba(59, 130, 246, 0.15);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-inicio:hover {
            background: rgba(37, 99, 235, 0.25);
            border-color: #22d3ee;
            color: #ffffff;
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.45);
            transform: translateY(-1px);
        }

        .logo-fge {
            position: fixed;
            top: 0.9rem;
            right: 1.25rem;
            z-index: 40;
            width: 5.75rem;
            height: 5.75rem;

            filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.75));

        @media (max-width: 639px) {

                right: 0.75rem;

                height: 4.1rem;

        .popover-layout {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            align-items: center;
        }
        .popover-divider {

        @media (min-width: 768px) {
            .md-px-8 { padding-left: 2rem; padding-right: 2rem; }

    <!-- LÓGICA DE LA APLICACIÓN (100% OFFLINE) -->
    <script>
        // =========================================================
        // FONDO DE PARTÍCULAS (Estilo isai.html con colores random y fondo azul)
        // =========================================================
        const canvas = document.getElementById('network-canvas');
        const ctx = canvas.getContext('2d');
        let particlesArray = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor(x, y, directionX, directionY, size, color) {
                this.x = x;
                this.y = y;
                this.directionX = directionX;
                this.directionY = directionY;
                this.size = size;
                this.color = color;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2, false);
                ctx.fillStyle = this.color;
                ctx.fill();
            }
            update() {
                if (this.x > canvas.width || this.x < 0) this.directionX = -this.directionX;
                if (this.y > canvas.height || this.y < 0) this.directionY = -this.directionY;
                this.x += this.directionX;
                this.y += this.directionY;
                this.draw();
            }
        }

        function initParticles() {
            particlesArray = [];
            let numberOfParticles = (canvas.height * canvas.width) / 18000;
            for (let i = 0; i < numberOfParticles; i++) {
                let size = (Math.random() * 2) + 1;
                let x = (Math.random() * ((canvas.width - size * 2) - (size * 2)) + size * 2);
                let y = (Math.random() * ((canvas.height - size * 2) - (size * 2)) + size * 2);
                let directionX = (Math.random() * 1) - 0.5;
                let directionY = (Math.random() * 1) - 0.5;
                
                // Colores random (verde neón, púrpura, azul cyan) respetando la temática ciber
                let colors = ['#5dff00', '#bc13fe', '#00f3ff', '#3b82f6'];
                let color = colors[Math.floor(Math.random() * colors.length)];

                particlesArray.push(new Particle(x, y, directionX, directionY, size, color));
            }
        }

        function animateParticles() {
            requestAnimationFrame(animateParticles);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].update();
            }
            connectParticles();
        }

        function connectParticles() {
            let opacityValue = 1;
            for (let a = 0; a < particlesArray.length; a++) {
                for (let b = a; b < particlesArray.length; b++) {
                    let distance = ((particlesArray[a].x - particlesArray[b].x) * (particlesArray[a].x - particlesArray[b].x)) + 
                                   ((particlesArray[a].y - particlesArray[b].y) * (particlesArray[a].y - particlesArray[b].y));
                    
                    if (distance < (canvas.width / 10) * (canvas.height / 10)) {
                        opacityValue = 1 - (distance / 20000);
                        ctx.strokeStyle = 'rgba(93, 255, 0,' + (opacityValue * 0.3) + ')';
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.moveTo(particlesArray[a].x, particlesArray[a].y);
                        ctx.lineTo(particlesArray[b].x, particlesArray[b].y);
                        ctx.stroke();
                    }
                }
            }
        }
        initParticles();
        animateParticles();

        const SVG_SATELLITE = `<svg class="svg-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="2"/><path d="M16.24 7.76a6 6 0 0 1 0 8.49m-8.48-.01a6 6 0 0 1 0-8.49m11.31-2.82a10 10 0 0 1 0 14.14m-14.14 0a10 10 0 0 1 0-14.14"/></svg>`;
        const SVG_EDIT = `<svg class="svg-icon" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>`;

        function formatDateTime24h(dateObj) {
            if (!dateObj || isNaN(dateObj.getTime())) return '';
            const day = String(dateObj.getDate()).padStart(2, '0');
            const month = String(dateObj.getMonth() + 1).padStart(2, '0');
            const year = dateObj.getFullYear();

            const hoursStr = String(dateObj.getHours()).padStart(2, '0');
            const minutesStr = String(dateObj.getMinutes()).padStart(2, '0');

            return `${day}/${month}/${year} ${hoursStr}:${minutesStr}`;
        }

        function parseDateTime24h(str) {
            if (!str) return null;
            const clean = str.trim();
            const regex = /^(\d{1,2})\/(\d{1,2})\/(\d{4})\s+(\d{1,2}):(\d{1,2})$/;
            const match = clean.match(regex);
            if (!match) return null;

            const day = parseInt(match[1], 10);
            const month = parseInt(match[2], 10) - 1;
            const year = parseInt(match[3], 10);
            const hours = parseInt(match[4], 10);
            const minutes = parseInt(match[5], 10);

            const parsed = new Date(year, month, day, hours, minutes, 0, 0);
            return isNaN(parsed.getTime()) ? null : parsed;
        }

        function updateLiveClock() {
            if (!modoRelojAutomatico) return;

            if (document.activeElement !== inputActual) {
                inputActual.value = formatDateTime24h(now);

        function configurarLoopScroll(contenedor) {
            let isAdjusting = false;
            contenedor.addEventListener('scroll', () => {
                if (isAdjusting) return;
                const cycleHeight = contenedor.scrollHeight / LOOP_REPEATS;
                if (cycleHeight <= 0) return;

                if (contenedor.scrollTop < cycleHeight * 0.75) {
                    isAdjusting = true;
                    contenedor.scrollTop += cycleHeight * 2;
                    isAdjusting = false;
                } else if (contenedor.scrollTop > cycleHeight * 3.25) {
                    isAdjusting = true;
                    contenedor.scrollTop -= cycleHeight * 2;
                    isAdjusting = false;
                }
            }, { passive: true });
        }

        function inicializarColumnasTiempo() {
            colHoras.innerHTML = '';
            for (let c = 0; c < LOOP_REPEATS; c++) {
                for (let h = 0; h < 24; h++) {
                    const val = String(h).padStart(2, '0');
                    const div = document.createElement('div');
                    div.className = 'time-item font-mono';
                    div.dataset.val = h;
                    div.dataset.cycle = c;
                    div.textContent = val;

                    colHoras.appendChild(div);

            colMinutos.innerHTML = '';
            for (let c = 0; c < LOOP_REPEATS; c++) {

                    const val = String(m).padStart(2, '0');
                    const div = document.createElement('div');
                    div.className = 'time-item font-mono';
                    div.dataset.val = m;

        function abrirPopoverParaInput(inputId) {

            const inputEl = document.getElementById(inputId);

            if (inputId === 'hora-actual') {

            const fechaRefActual = obtenerFechaHoraActualReferencia();
            let currentObj = parseDateTime24h(inputEl.value) || fieldDates[inputId];

            if (!currentObj) {
                currentObj = new Date(fechaRefActual.getTime());
                fieldDates[inputId] = currentObj;

            viewMonth = currentObj.getMonth();

            renderCalendario();

            posicionarPopover(inputEl);

        function posicionarPopover(inputEl) {
            const popRect = popover.getBoundingClientRect();

            // En pantallas móviles centramos el selector en la pantalla para que nunca se corte arriba ni abajo
            if (window.innerWidth < 640) {
                const top = Math.max(12, (window.innerHeight - popRect.height) / 2);
                const left = Math.max(8, (window.innerWidth - popRect.width) / 2);
                popover.style.top = `${top}px`;
                popover.style.left = `${left}px`;
                return;
            }

            const rect = inputEl.getBoundingClientRect();
            let top = rect.bottom + 8;
            let left = rect.left + (rect.width / 2) - (popRect.width / 2);

            if (top + popRect.height > window.innerHeight - 12) {
                top = Math.max(12, rect.top - popRect.height - 8);
            }
            if (top < 12) top = 12;
            if (left < 12) left = 12;
            if (left + popRect.width > window.innerWidth - 12) {
                left = window.innerWidth - popRect.width - 12;
            }

            popover.style.top = `${top}px`;
            popover.style.left = `${left}px`;
        }

        function cerrarPopover() {
            popover.classList.add('hidden');
            activeInputId = null;
        }

        function cambiarMes(delta) {
            if (calendarSubView === 'anio') {
                viewYear += delta * 12;
                renderVistaAnios();
                return;
            }
            viewMonth += delta;
            if (viewMonth < 0) {
                viewMonth = 11;
                viewYear--;
            } else if (viewMonth > 11) {
                viewMonth = 0;
                viewYear++;
            }
            sincronizarMesAnioEnFechaActiva();
            renderCalendario();
        }

        function sincronizarMesAnioEnFechaActiva() {
            if (!activeInputId || !fieldDates[activeInputId]) return;
            const actual = fieldDates[activeInputId];
            const maxDiaMes = new Date(viewYear, viewMonth + 1, 0).getDate();
            const diaAjustado = Math.min(actual.getDate(), maxDiaMes);
            const nuevaFecha = new Date(
                viewYear,
                viewMonth,
                diaAjustado,
                actual.getHours(),
                actual.getMinutes(),
                0,
                0
            );
            fieldDates[activeInputId] = nuevaFecha;
            document.getElementById(activeInputId).value = formatDateTime24h(nuevaFecha);
        }

        function toggleVistaSelector(tipo) {
            if (calendarSubView === tipo) {
                calendarSubView = 'dias';

                calendarSubView = tipo;

            renderCalendario();

        function renderVistaMeses() {
            const monthView = document.getElementById('cal-month-view');
            monthView.innerHTML = '';
            nombresMeses.forEach((nombre, idx) => {
                const item = document.createElement('div');
                item.className = 'year-item' + (idx === viewMonth ? ' selected' : '');
                item.textContent = nombre.substring(0, 3).toUpperCase();
                item.onclick = () => {
                    viewMonth = idx;
                    calendarSubView = 'dias';
                    sincronizarMesAnioEnFechaActiva();
                    renderCalendario();
                };
                monthView.appendChild(item);
            });
        }

        function renderVistaAnios() {
            const yearView = document.getElementById('cal-year-view');
            yearView.innerHTML = '';
            const anioActualSistema = new Date().getFullYear();
            const anioInicio = 1995;
            const anioFin = anioActualSistema + 10;

            let selectedEl = null;
            for (let y = anioInicio; y <= anioFin; y++) {
                const item = document.createElement('div');
                item.className = 'year-item' + (y === viewYear ? ' selected' : '');
                item.textContent = y;
                if (y === viewYear) selectedEl = item;
                item.onclick = () => {
                    viewYear = y;
                    calendarSubView = 'dias';
                    sincronizarMesAnioEnFechaActiva();
                    renderCalendario();
                };
                yearView.appendChild(item);
            }

            if (selectedEl) {
                requestAnimationFrame(() => {
                    yearView.scrollTop = selectedEl.offsetTop - yearView.offsetTop - (yearView.clientHeight / 2) + (selectedEl.clientHeight / 2);
                });
            }
        }

        function renderCalendario() {
            document.getElementById('cal-mes-label').textContent = nombresMesesCortos[viewMonth];
            document.getElementById('cal-anio-label').textContent = viewYear;

            const daysView = document.getElementById('cal-days-view');
            const monthView = document.getElementById('cal-month-view');
            const yearView = document.getElementById('cal-year-view');

            daysView.classList.add('hidden');
            monthView.classList.add('hidden');
            yearView.classList.add('hidden');

            if (calendarSubView === 'mes') {
                monthView.classList.remove('hidden');
                renderVistaMeses();
                return;
            }
            if (calendarSubView === 'anio') {
                yearView.classList.remove('hidden');
                renderVistaAnios();
                return;
            }

            daysView.classList.remove('hidden');
            const grid = document.getElementById('cal-grid');
            grid.innerHTML = '';

            const primerDiaMes = new Date(viewYear, viewMonth, 1).getDay();
            const offsetInicio = (primerDiaMes + 6) % 7;
            const totalDiasMes = new Date(viewYear, viewMonth + 1, 0).getDate();

            const selectedDate = activeInputId ? fieldDates[activeInputId] : null;
            const hoy = new Date();

            for (let i = 0; i < offsetInicio; i++) {
                const empty = document.createElement('div');
                empty.className = 'cal-day empty';
                grid.appendChild(empty);
            }

            for (let dia = 1; dia <= totalDiasMes; dia++) {
                const cell = document.createElement('div');
                cell.className = 'cal-day';
                cell.textContent = dia;

                if (
                    selectedDate &&
                    selectedDate.getFullYear() === viewYear &&
                    selectedDate.getMonth() === viewMonth &&
                    selectedDate.getDate() === dia
                ) {
                    cell.classList.add('selected');
                }

                if (
                    hoy.getFullYear() === viewYear &&
                    hoy.getMonth() === viewMonth &&
                    hoy.getDate() === dia
                ) {
                    cell.classList.add('today');
                }

                cell.onclick = () => seleccionarDiaCalendario(viewYear, viewMonth, dia);
                grid.appendChild(cell);
            }

        function seleccionarDiaCalendario(year, month, day) {
            if (!activeInputId) return;

            const horaActualRef = obtenerFechaHoraActualReferencia();
            let nuevaFecha;

            if (activeInputId === 'hora-actual') {
                const prev = fieldDates['hora-actual'] || horaActualRef;
                nuevaFecha = new Date(year, month, day, prev.getHours(), prev.getMinutes(), 0, 0);
            } else {
                nuevaFecha = new Date(
                    year,
                    month,
                    day,
                    horaActualRef.getHours(),
                    horaActualRef.getMinutes(),
                    0,
                    0
                );
            }

            fieldDates[activeInputId] = nuevaFecha;
            document.getElementById(activeInputId).value = formatDateTime24h(nuevaFecha);

            renderCalendario();
            actualizarVistaColumnasTiempo(nuevaFecha, true);
        }

        function seleccionarHoraColumna(hora24) {

        function marcarYDesplazarColumna(contenedor, valorBuscado, hacerScroll) {
            const items = contenedor.querySelectorAll('.time-item');
            const targetCycle = String(MIDDLE_CYCLE);
            let targetItem = null;

            items.forEach(item => {
                if (item.dataset.val === valorBuscado) {
                    item.classList.add('active');
                    if (item.dataset.cycle === targetCycle) {
                        targetItem = item;
                    }
                } else {
                    item.classList.remove('active');

            if (hacerScroll && targetItem) {
                contenedor.scrollTop = targetItem.offsetTop - contenedor.offsetTop;

        function obtenerIconoEstadoSVG(estado) {

                return `<svg class="svg-icon" viewBox="0 0 24 24"><polygon points="13 19 22 12 13 5 13 19"/><polygon points="2 19 11 12 2 5 2 19"/></svg>`;

        function calcularDesfase() {
            const inputActualStr = document.getElementById('hora-actual').value.trim();
            const inputDVRStr = document.getElementById('hora-dvr').value.trim();
            const inputPeticionStr = document.getElementById('hora-peticion').value.trim();

            if (!inputActualStr) {
                showAlert("Debe ingresar o mantener activa la Hora Actual.");
                return;
            }
            if (!inputDVRStr) {
                showAlert("Debe ingresar la fecha y hora observada actualmente en el DVR.");
                return;
            }
            if (!inputPeticionStr) {
                showAlert("Debe ingresar la Fecha Solicitada en la Petición (horario real que desea buscar).");
                return;
            }

            const dateActual = parseDateTime24h(inputActualStr) || fieldDates['hora-actual'];
            const dateDVR = parseDateTime24h(inputDVRStr) || fieldDates['hora-dvr'];
            const datePeticion = parseDateTime24h(inputPeticionStr) || fieldDates['hora-peticion'];

            if (!dateActual || !dateDVR || !datePeticion) {
                showAlert("El formato de alguna de las fechas no es válido. Utilice el selector o el formato DD/MM/AAAA HH:mm.");
                return;
            }

            // Diferencia matemática: (Hora DVR - Hora Actual)
            const diferenciaMs = dateDVR.getTime() - dateActual.getTime();
            const diferenciaAbsoluta = Math.abs(diferenciaMs);

            const dias = Math.floor(diferenciaAbsoluta / (1000 * 60 * 60 * 24));
            const horas = Math.floor((diferenciaAbsoluta % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutos = Math.floor((diferenciaAbsoluta % (1000 * 60 * 60)) / (1000 * 60));

            let estadoTexto = "Sincronizado";
            let colorEstado = "text-green-400";
            
            if (diferenciaMs > 0) {
                estadoTexto = "Adelantado";
                colorEstado = "text-amber-400";
            } else if (diferenciaMs < 0) {
                estadoTexto = "Atrasado";
                colorEstado = "text-red-400";
            }

            let desfaseStr = "";
            if (dias > 0) desfaseStr += `${dias} día${dias !== 1 ? 's' : ''}, `;
            desfaseStr += `${horas} hr${horas !== 1 ? 's' : ''}, ${minutos} min`;
            if (diferenciaMs === 0) desfaseStr = "0 minutos (Sin desfase)";

            // Fecha_Buscar_DVR = Fecha_Peticion + (Hora_DVR - Hora_Actual)
            const dateBuscarEnDVR = new Date(datePeticion.getTime() + diferenciaMs);

            cerrarPopover();

            agregarAlHistorial({
                actual: formatDateTime24h(dateActual),
                dvr: formatDateTime24h(dateDVR),
                peticion: formatDateTime24h(datePeticion),
                buscarDVR: formatDateTime24h(dateBuscarEnDVR),
                estado: estadoTexto,
                color: colorEstado,
                diferencia: desfaseStr
            });
        }

            const panel = document.getElementById('panel-historial');

            panel.classList.remove('hidden');

                ? '#f59e0b' 
                : (data.estado === 'Atrasado' ? '#ef4444' : '#22c55e');

            const card = document.createElement('div');
            card.className = 'glass-panel rounded-xl p-5 flex flex-col gap-5 relative overflow-hidden';
            card.style.borderColor = '#475569';
            
            card.innerHTML = `
                <div class="absolute left-0 top-0 bottom-0 w-1.5" style="background-color: ${barHex};"></div>
                
                <!-- Fila Superior: Datos de Entrada y Estado de Desfase -->
                <div class="flex flex-col md-row gap-4 justify-between items-start pl-3">
                    <div class="flex flex-col gap-2 w-full">
                        <span class="text-xs text-blue-300 font-bold tracking-widest uppercase flex items-center gap-1.5">
                            <svg class="svg-icon text-cyan-400" viewBox="0 0 24 24">
                                <line x1="22" y1="12" x2="2" y2="12"/>
                                <path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>
                                <line x1="6" y1="16" x2="6.01" y2="16"/>
                                <line x1="10" y1="16" x2="10.01" y2="16"/>
                            </svg>
                            CÁLCULO FORENSE #${contadorResultados}
                        </span>
                        <div class="flex flex-wrap items-center gap-2">
                            <span class="font-semibold uppercase text-blue-300 w-32" style="font-size: 11px;">Hora Actual:</span>
                            <span class="font-mono text-sm text-gray-200 px-2.5 py-0.5 rounded" style="background: rgba(30, 41, 59, 0.8); border: 1px solid #334155;">${data.actual}</span>
                        </div>
                        <div class="flex flex-wrap items-center gap-2">
                            <span class="font-semibold uppercase text-amber-400 w-32" style="font-size: 11px;">Hora en DVR:</span>
                            <span class="font-mono text-sm text-amber-200 px-2.5 py-0.5 rounded" style="background: rgba(120, 53, 15, 0.25); border: 1px solid rgba(180, 83, 9, 0.5);">${data.dvr}</span>
                        </div>
                        <div class="flex flex-wrap items-center gap-2">
                            <span class="font-semibold uppercase text-emerald-400 w-32" style="font-size: 11px;">Fecha Petición:</span>
                            <span class="font-mono text-sm text-emerald-200 px-2.5 py-0.5 rounded" style="background: rgba(6, 78, 59, 0.25); border: 1px solid rgba(4, 120, 87, 0.5);">${data.peticion}</span>
                        </div>
                    </div>

                    <div class="flex flex-col items-end gap-1.5 w-full md-w-auto p-4 rounded-lg shrink-0" style="min-width: 240px; background: rgba(15, 23, 42, 0.85); border: 1px solid rgba(51, 65, 85, 0.7);">
                        <div class="flex items-center gap-2 ${data.color} font-bold uppercase tracking-wider text-sm">
                            ${obtenerIconoEstadoSVG(data.estado)} DVR ${data.estado}
                        </div>
                        <div class="text-xs font-mono text-gray-300 text-right w-full flex flex-col gap-1 mt-1">
                            <span>Desfase calculado:</span>
                            <span class="text-white font-semibold text-sm px-2.5 py-1 rounded inline-block text-center" style="background: rgba(0, 0, 0, 0.5); border: 1px solid #1e293b;">${data.diferencia}</span>
                        </div>
                    </div>
                </div>

                <!-- Recuadro Inferior Destacado: Fecha y Hora Exacta a Buscar en el DVR (Separado con mt-5 para evitar solapamientos) -->
                <div class="ml-3 mt-5 result-banner rounded-xl p-4 flex flex-col items-center text-center gap-3">
                    <div class="flex flex-col items-center">
                        <span class="font-bold uppercase tracking-widest text-cyan-400 flex items-center justify-center gap-1.5 text-xs">
                            <svg class="svg-icon" viewBox="0 0 24 24">
                                <circle cx="12" cy="12" r="10"/>
                                <line x1="22" y1="12" x2="18" y2="12"/>
                                <line x1="6" y1="12" x2="2" y2="12"/>
                                <line x1="12" y1="6" x2="12" y2="2"/>
                                <line x1="12" y1="22" x2="12" y2="18"/>
                            </svg>
                            FECHA Y HORA A BUSCAR EN EL DVR:
                        </span>
                        <span class="text-xs text-gray-300 mt-1">
                            Busque este horario en la línea de tiempo del grabador para ubicar el evento del ${data.peticion}
                        </span>
                    </div>
                    <div class="result-time-box font-mono font-bold text-cyan-300 whitespace-nowrap mt-1">
                        ${data.buscarDVR}
                    </div>
                </div>
            `;
            grid.prepend(card);
        }

        function limpiarHistorial() {
            document.getElementById('grid-historial').innerHTML = '';
            document.getElementById('panel-historial').classList.add('hidden');
            contadorResultados = 0;
        }
    </script>
</body>
</html>
