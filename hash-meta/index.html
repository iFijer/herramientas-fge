    <script>
        /* =========================================================
           MOTORES CRIPTOGRÁFICOS Y EXIF 100% OFFLINE (SIN CDN)
           ========================================================= */

        // 1. Motor Incremental MD5 (Compatible con SparkMD5.ArrayBuffer)
        const SparkMD5 = (function() {
            const S = [
                7, 12, 17, 22, 7, 12, 17, 22, 7, 12, 17, 22, 7, 12, 17, 22,
                5,  9, 14, 20, 5,  9, 14, 20, 5,  9, 14, 20, 5,  9, 14, 20,
                4, 11, 16, 23, 4, 11, 16, 23, 4, 11, 16, 23, 4, 11, 16, 23,
                6, 10, 15, 21, 6, 10, 15, 21, 6, 10, 15, 21, 6, 10, 15, 21
            ];
            const K = new Uint32Array(64);
            for (let i = 0; i < 64; i++) {
                K[i] = Math.floor(Math.abs(Math.sin(i + 1)) * 4294967296) >>> 0;
            }

            function md5cycle(x, k) {
                let a = x[0], b = x[1], c = x[2], d = x[3];
                for (let i = 0; i < 64; i++) {
                    let f, g;
                    if (i < 16) {
                        f = (b & c) | ((~b) & d);
                        g = i;
                    } else if (i < 32) {
                        f = (d & b) | ((~d) & c);
                        g = (5 * i + 1) % 16;
                    } else if (i < 48) {
                        f = b ^ c ^ d;
                        g = (3 * i + 5) % 16;
                    } else {
                        f = c ^ (b | (~d));
                        g = (7 * i) % 16;
                    }
                    const temp = d;
                    d = c;
                    c = b;
                    const sum = (a + f + K[i] + k[g]) | 0;
                    const s = S[i];
                    b = (b + ((sum << s) | (sum >>> (32 - s)))) | 0;
                    a = temp;
                }
                x[0] = (x[0] + a) | 0;
                x[1] = (x[1] + b) | 0;
                x[2] = (x[2] + c) | 0;
                x[3] = (x[3] + d) | 0;
            }

            class ArrayBufferHasher {
                constructor() {
                    this.reset();
                }
                reset() {
                    this.state = new Int32Array([0x67452301, 0xefcdab89, 0x98badcfe, 0x10325476]);
                    this.buffer = new Uint8Array(64);
                    this.bufferLen = 0;
                    this.totalBytes = 0;
                }
                append(arrBuf) {
                    const input = new Uint8Array(arrBuf);
                    let offset = 0;
                    const len = input.length;
                    this.totalBytes += len;
                    const blockWords = new Int32Array(16);

                    if (this.bufferLen > 0) {
                        const needed = 64 - this.bufferLen;
                        if (len < needed) {
                            this.buffer.set(input, this.bufferLen);
                            this.bufferLen += len;
                            return this;
                        }
                        this.buffer.set(input.subarray(0, needed), this.bufferLen);
                        for (let i = 0; i < 16; i++) {
                            const j = i * 4;
                            blockWords[i] = this.buffer[j] | (this.buffer[j + 1] << 8) | (this.buffer[j + 2] << 16) | (this.buffer[j + 3] << 24);
                        }
                        md5cycle(this.state, blockWords);
                        offset += needed;
                        this.bufferLen = 0;
                    }

                    while (offset + 64 <= len) {
                        for (let i = 0; i < 16; i++) {
                            const j = offset + i * 4;
                            blockWords[i] = input[j] | (input[j + 1] << 8) | (input[j + 2] << 16) | (input[j + 3] << 24);
                        }
                        md5cycle(this.state, blockWords);
                        offset += 64;
                    }

                    if (offset < len) {
                        this.bufferLen = len - offset;
                        this.buffer.set(input.subarray(offset), 0);
                    }
                    return this;
                }
                end() {
                    const tail = new Uint8Array(128);

        dropzone.addEventListener('dragleave', e => { e.preventDefault(); dropzone.classList.remove('dropzone-active'); });
        
        dropzone.addEventListener('drop', async (e) => {
            e.preventDefault(); dropzone.classList.remove('dropzone-active');
            if (!validateModesActive()) return;
            const filesToProcess = [];
            
            // Atrapar ruta principal antes de que Windows la oculte
            if (e.dataTransfer.files) {
                for(let i = 0; i < e.dataTransfer.files.length; i++){
                    let f = e.dataTransfer.files[i];
                    if (f.path) rootMap[f.name] = f.path; 
                }
            }
            if (e.dataTransfer && e.dataTransfer.items) {
                const promises = [];
                for (let i = 0; i < e.dataTransfer.items.length; i++) {
                    const item = e.dataTransfer.items[i];
                    if (item.kind === 'file') {
                        const entry = item.webkitGetAsEntry ? item.webkitGetAsEntry() : null;
                        if (entry && entry.isDirectory) promises.push(traverseDirectory(entry, filesToProcess));
                        else {
                            const file = item.getAsFile();
                            if (file) { file.customPath = file.path || rootMap[file.name] || file.name; filesToProcess.push(file); }
                        }
                    }
                }
                await Promise.all(promises);
            }
            if (filesToProcess.length > 0) handleFiles(filesToProcess);
        });

        async function traverseDirectory(entry, fileArray) {
            return new Promise((resolve) => {
                if (entry.isFile) {
                    entry.file(file => {
                        const pathParts = entry.fullPath.split('/').filter(p => p); 
                        if (pathParts.length > 0) {
                            const rootName = pathParts[0]; 
                            const absoluteRoot = rootMap[rootName]; 
                            if (absoluteRoot) {
                                let finalPath = absoluteRoot;
                                if (pathParts.length > 1) { finalPath = absoluteRoot + '\\' + pathParts.slice(1).join('\\'); }
                                file.customPath = finalPath;
                            } else file.customPath = entry.fullPath;
                        }
                        fileArray.push(file); resolve();
                    }, resolve);
                } else if (entry.isDirectory) {
                    const dirReader = entry.createReader();
                    const readAllEntries = (entriesArray) => {
                        dirReader.readEntries(async (results) => {
                            if (results.length > 0) { entriesArray.push(...results); readAllEntries(entriesArray); } 
                            else { for (let i = 0; i < entriesArray.length; i++) await traverseDirectory(entriesArray[i], fileArray); resolve(); }
                        }, resolve);
                    };
                    readAllEntries([]);
                } else resolve();
            });
        }

        function formatBytes(bytes) {
            if (!+bytes) return '0 Bytes';
            const sizes = ['Bytes', 'KB', 'MB', 'GB', 'TB'];
            const i = Math.floor(Math.log(bytes) / Math.log(1024));
            return `${parseFloat((bytes / Math.pow(1024, i)).toFixed(2))} ${sizes[i]}`;

        function formatDuration(sec) {
            if (!sec || isNaN(sec) || !isFinite(sec) || sec <= 0) return 'Desc';
            const totalSec = Math.round(sec);
            const h = Math.floor(totalSec / 3600);
            const m = Math.floor((totalSec % 3600) / 60);
            const s = Math.floor(totalSec % 60);
            return `${h > 0 ? h + 'h ' : ''}${m}m ${s}s`;
        }

        function formatExifDateString(exifDate) {
            if (!exifDate || typeof exifDate !== 'string') return null;
            const clean = exifDate.trim();
            const match = clean.match(/^(\d{4})[:\-](\d{2})[:\-](\d{2})\s+(\d{2}):(\d{2}):(\d{2})/);
            if (match) {
                const d = new Date(
                    parseInt(match[1], 10),
                    parseInt(match[2], 10) - 1,
                    parseInt(match[3], 10),
                    parseInt(match[4], 10),
                    parseInt(match[5], 10),
                    parseInt(match[6], 10)
                );
                if (!isNaN(d.getTime())) return d.toLocaleString('es-MX');
            }
            return clean;
        }

        function parseFilenameCreationDateObj(filename) {
            if (!filename) return null;
            const regex = /(20\d{2})[\-_]?([01]\d)[\-_]?([0-3]\d)[\-_\sT]*([0-2]\d)[\.:_]?([0-5]\d)[\.:_]?([0-5]\d)/;
            const m = filename.match(regex);
            if (m) {
                const year = parseInt(m[1], 10);
                const month = parseInt(m[2], 10) - 1;
                const day = parseInt(m[3], 10);
                const hour = parseInt(m[4], 10);
                const min = parseInt(m[5], 10);
                const sec = parseInt(m[6], 10);
                if (month >= 0 && month < 12 && day >= 1 && day <= 31 && hour < 24) {
                    const d = new Date(year, month, day, hour, min, sec);
                    if (!isNaN(d.getTime())) return d;
                }
            }
            return null;
        }

        function parseFilenameCreationDate(filename) {
            const d = parseFilenameCreationDateObj(filename);
            return d ? d.toLocaleString('es-MX') : null;
        }

        function parseMp4MvhdInfo(uint8) {
            if (!uint8 || uint8.length < 36) return null;
            const view = new DataView(uint8.buffer, uint8.byteOffset, uint8.byteLength);
            for (let i = 0; i <= uint8.length - 36; i++) {
                if (uint8[i] === 0x6D && uint8[i + 1] === 0x76 && uint8[i + 2] === 0x68 && uint8[i + 3] === 0x64) {
                    const version = uint8[i + 4];
                    if (version !== 0 && version !== 1) continue;
                    if (uint8[i + 5] !== 0 || uint8[i + 6] !== 0 || uint8[i + 7] !== 0) continue;

                    let seconds1904 = 0;
                    let timescale = 0;
                    let durationUnits = 0;

                    if (version === 0) {
                        seconds1904 = view.getUint32(i + 8, false);
                        timescale = view.getUint32(i + 16, false);
                        durationUnits = view.getUint32(i + 20, false);
                    } else if (version === 1 && i + 36 <= uint8.length) {
                        seconds1904 = (view.getUint32(i + 8, false) * 4294967296) + view.getUint32(i + 12, false);
                        timescale = view.getUint32(i + 24, false);
                        durationUnits = (view.getUint32(i + 28, false) * 4294967296) + view.getUint32(i + 32, false);
                    }

                    let creationDateStr = null;
                    if (seconds1904 > 2082844800) {
                        const unixMs = (seconds1904 - 2082844800) * 1000;
                        const d = new Date(unixMs);
                        const yr = d.getFullYear();
                        if (yr >= 1995 && yr <= 2050) {
                            creationDateStr = d.toLocaleString('es-MX');
                        }
                    }

                    let durationSec = null;
                    if (timescale > 0 && durationUnits > 0 && durationUnits !== 0xFFFFFFFF) {
                        const calcSec = durationUnits / timescale;
                        if (calcSec > 0 && calcSec < 365 * 24 * 3600) {
                            durationSec = calcSec;
                        }
                    }

                    if (creationDateStr || durationSec) {
                        return { creationDateStr, durationSec };
                    }
                }
            }
            return null;
        }

        function parseMp4MvhdDate(uint8) {
            const info = parseMp4MvhdInfo(uint8);
            return info ? info.creationDateStr : null;
        }

        /* =========================================================
           MOTOR BINARIO MULTIFORMATO PARA LECTURA DE DURACIÓN Y
           RESOLUCIÓN (MP4, MOV, AVI, MKV, WEBM, FLV, CCTV > 15 HRS)
           ========================================================= */
        function parseHeaderBoxTiming(uint8, offset) {
            if (offset + 24 > uint8.length) return null;
            const view = new DataView(uint8.buffer, uint8.byteOffset, uint8.byteLength);
            const version = uint8[offset + 4];
            if (version !== 0 && version !== 1) return null;
            if (uint8[offset + 5] !== 0 || uint8[offset + 6] !== 0 || uint8[offset + 7] !== 0) return null;

            // Si tenemos los 4 bytes previos, validamos que correspondan al tamaño estándar de mvhd o mdhd
            if (offset >= 4) {
                const boxSize = view.getUint32(offset - 4, false);
                if (boxSize < 24 || boxSize > 512) return null;
            }

            let timescale = 0;
            let durationUnits = 0;

            if (version === 0) {
                timescale = view.getUint32(offset + 16, false);
                durationUnits = view.getUint32(offset + 20, false);
            } else if (offset + 36 <= uint8.length) {
                timescale = view.getUint32(offset + 24, false);
                durationUnits = (view.getUint32(offset + 28, false) * 4294967296) + view.getUint32(offset + 32, false);
            }

            if (timescale > 0 && timescale <= 50000000 && durationUnits > 0 && durationUnits !== 0xFFFFFFFF) {
                const sec = durationUnits / timescale;
                if (sec > 0.05 && sec < 180 * 24 * 3600) {
                    return { timescale, durationUnits, durationSec: sec };
                }
            }
            return { timescale, durationUnits: 0, durationSec: null };
        }

        function scanMp4BufferForMeta(uint8) {
            if (!uint8 || uint8.length < 32) return { durationSec: null, resolution: null };
            const view = new DataView(uint8.buffer, uint8.byteOffset, uint8.byteLength);
            let bestDurationSec = null;
            let resolution = null;
            let lastMdhdTimescale = 0;

            for (let i = 0; i <= uint8.length - 28; i++) {
                const b0 = uint8[i], b1 = uint8[i + 1], b2 = uint8[i + 2], b3 = uint8[i + 3];

                // 1. Átomo 'mvhd' (Movie Header) o 'mdhd' (Media Track Header)
                const isMvhd = (b0 === 0x6D && b1 === 0x76 && b2 === 0x68 && b3 === 0x64);
                const isMdhd = (b0 === 0x6D && b1 === 0x64 && b2 === 0x68 && b3 === 0x64);
                if (isMvhd || isMdhd) {
                    const timing = parseHeaderBoxTiming(uint8, i);
                    if (timing) {
                        if (isMdhd && timing.timescale > 0) lastMdhdTimescale = timing.timescale;
                        if (timing.durationSec && (!bestDurationSec || timing.durationSec > bestDurationSec)) {
                            bestDurationSec = timing.durationSec;
                        }
                    }
                }

                // 2. Átomo 'stts' (Time-to-Sample) si mvhd/mdhd tenían duración 0
                if (!bestDurationSec && lastMdhdTimescale > 0 && b0 === 0x73 && b1 === 0x74 && b2 === 0x74 && b3 === 0x73) {
                    if (uint8[i + 4] === 0 && uint8[i + 5] === 0 && uint8[i + 6] === 0 && uint8[i + 7] === 0 && i + 12 <= uint8.length) {
                        const entryCount = view.getUint32(i + 8, false);
                        if (entryCount > 0 && entryCount < 500000 && i + 12 + entryCount * 8 <= uint8.length) {
                            let totalDelta = 0;
                            let pos = i + 12;
                            for (let e = 0; e < entryCount; e++) {
                                const count = view.getUint32(pos, false);
                                const delta = view.getUint32(pos + 4, false);
                                totalDelta += (count * delta);
                                pos += 8;
                            }
                            const calcSec = totalDelta / lastMdhdTimescale;
                            if (calcSec > 0.05 && calcSec < 180 * 24 * 3600) {
                                bestDurationSec = calcSec;
                            }

            }

            const chosen = dhavList.length > 0 ? dhavList : (ptsList.length > 0 ? ptsList : scrList);
            if (chosen.length === 0) return null;
            chosen.sort((a, b) => a - b);
            return chosen[Math.floor(chosen.length / 2)];
        }

        // Muestreo multipunto para streams CCTV (Hikvision IMKH, MPEG-PS, MPEG-TS, Dahua DHAV)
        async function calculateStreamDurationMultiSample(file) {
            const numSamples = 28;
            const sampleSize = Math.min(128 * 1024, file.size);
            const timestamps = [];

            for (let s = 0; s < numSamples; s++) {
                const startPos = Math.floor((s / (numSamples - 1)) * Math.max(0, file.size - sampleSize));
                const buf = await file.slice(startPos, startPos + sampleSize).arrayBuffer();
                const ts = extractStreamMedianTimestampSec(new Uint8Array(buf));
                if (ts !== null) timestamps.push(ts);
            }

            if (timestamps.length < 2) return null;

            let totalSec = 0;
            const MAX_33BIT_SEC = 8589934592 / 90000; // ~95443.717s (26.54 horas)

            for (let k = 1; k < timestamps.length; k++) {
                const prev = timestamps[k - 1];
                const curr = timestamps[k];
                let delta = 0;

                if (curr >= prev) {
                    delta = curr - prev;
                } else {
                    // Cruce de medianoche (86400s) o desbordamiento de reloj de 33 bits (95443.7s)
                    if (prev > 75000 && curr < 15000) {
                        const wrapBase = prev > 86400 ? MAX_33BIT_SEC : 86400;
                        delta = (wrapBase - prev) + curr;
                    } else if (curr < 600) {
                        // Reinicio de segmento a 0
                        delta = curr;
                    }
                }

                // Filtrar saltos anómalos entre dos muestras contiguas
                if (delta > 0 && delta < 14400) {
                    totalSec += delta;
                }
            }

            return totalSec > 0.5 ? totalSec : null;
        }

        async function extractBinaryVideoFallback(file) {
            let resolution = null;
            let durationSec = null;

            try {
                // 1. Escaneo rápido de cabecera inicial (primeros 2 MB) para detectar formato (AVI, MKV/WebM, FLV, MP4)
                const headSize = Math.min(2 * 1024 * 1024, file.size);
                const headBuf = await file.slice(0, headSize).arrayBuffer();
                const headBytes = new Uint8Array(headBuf);

                // A) ¿Es AVI?
                const aviMeta = parseAviHeaderMeta(headBytes);
                if (aviMeta) {
                    if (aviMeta.durationSec) durationSec = aviMeta.durationSec;
                    if (aviMeta.resolution) resolution = aviMeta.resolution;
                }

                // B) ¿Es MKV / WebM?
                if (!durationSec || !resolution) {
                    const mkvMeta = parseMkvWebmHeaderMeta(headBytes);
                    if (mkvMeta) {
                        if (!durationSec && mkvMeta.durationSec) durationSec = mkvMeta.durationSec;
                        if (!resolution && mkvMeta.resolution) resolution = mkvMeta.resolution;
                    }
                }

                // C) ¿Es FLV?
                if (!durationSec || !resolution) {
                    const flvMeta = parseFlvHeaderMeta(headBytes);
                    if (flvMeta) {
                        if (!durationSec && flvMeta.durationSec) durationSec = flvMeta.durationSec;
                        if (!resolution && flvMeta.resolution) resolution = flvMeta.resolution;
                    }
                }

                // D) Recorrido jerárquico de átomos MP4 / MOV / 3GP / M4V
                if (!durationSec || !resolution) {
                    const treeMeta = await extractMp4MetadataByBoxTree(file);
                    if (treeMeta) {
                        if (!durationSec && treeMeta.durationSec) durationSec = treeMeta.durationSec;
                        if (!resolution && treeMeta.resolution) resolution = treeMeta.resolution;
                    }
                }

                // E) Escaneo directo en cabecera inicial (2 MB) y cola final del archivo (hasta 48 MB en bloques de 8 MB)
                if (!durationSec || !resolution) {
                    const headMp4 = scanMp4BufferForMeta(headBytes);
                    if (!durationSec && headMp4.durationSec) durationSec = headMp4.durationSec;
                    if (!resolution && headMp4.resolution) resolution = headMp4.resolution;
                }

                if ((!durationSec || !resolution) && file.size > headSize) {
                    const chunkStep = 8 * 1024 * 1024;
                    const maxTailSearch = Math.min(48 * 1024 * 1024, file.size);
                    for (let dist = chunkStep; dist <= maxTailSearch; dist += chunkStep) {
                        const start = Math.max(0, file.size - dist);
                        const end = Math.min(file.size, start + chunkStep + 1024);
                        const tailBuf = await file.slice(start, end).arrayBuffer();
                        const tailMeta = scanMp4BufferForMeta(new Uint8Array(tailBuf));
                        if (!durationSec && tailMeta.durationSec) durationSec = tailMeta.durationSec;
                        if (!resolution && tailMeta.resolution) resolution = tailMeta.resolution;
                        if (durationSec && resolution) break;
                    }
                }

                // F) Si es un flujo CCTV (Hikvision IMKH, Dahua DHAV, MPEG-PS, MPEG-TS):
                //    Extraer resolución decodificando directamente el bitstream H.264 / H.265 SPS
                if (!resolution) {
                    resolution = parseH264OrHevcSpsResolution(headBytes);
                }

                // G) Calcular duración real del flujo de video por muestreo multipunto de relojes PTS / SCR / DHAV
                if (!durationSec) {
                    durationSec = await calculateStreamDurationMultiSample(file);
                }
            } catch (e) {}

            return {
                durationSec: durationSec || null,
                resolution: resolution || 'Codec CCTV / Propietario',
                duration: durationSec ? formatDuration(durationSec) : 'No indexado en cabecera'
            };
        }

        async function extractUniversalFileMetadata(file, cardId, evidenceItem) {
            const creatorEl = document.getElementById(`meta-creator-${cardId}`);
            const creationEl = document.getElementById(`meta-creation-${cardId}`);
            const lastMod = file.lastModified ? new Date(file.lastModified).toLocaleString('es-MX') : 'Desconocido';
            const ruta = file.customPath || file.path || file.name || '';

            let foundCreation = null;
            let foundCreator = null;

            if (/^DJI_/i.test(file.name)) {
                foundCreator = 'DJI Camera / Drone';
            } else if (/^GOPR|^GH\d/i.test(file.name)) {
                foundCreator = 'GoPro Camera';
            } else if (/WhatsApp/i.test(file.name)) {
                foundCreator = 'WhatsApp Media';
            }

            const userMatch = ruta.match(/[\\\/]Users[\\\/]([^\\\/]+)[\\\/]/i) || ruta.match(/[\\\/]Usuarios[\\\/]([^\\\/]+)[\\\/]/i);
            const osUser = userMatch && userMatch[1] ? `${userMatch[1]} (Sistema)` : null;

            try {
                const sliceSize = Math.min(256 * 1024, file.size);
                const headBuffer = await file.slice(0, sliceSize).arrayBuffer();
                const headBytes = new Uint8Array(headBuffer);
                const decoder = new TextDecoder('latin1');
                let textChunk = decoder.decode(headBytes);

                let tailBytes = null;
                if (file.size > sliceSize) {
                    const tailStart = Math.max(sliceSize, file.size - sliceSize);
                    const tailBuffer = await file.slice(tailStart, file.size).arrayBuffer();
                    tailBytes = new Uint8Array(tailBuffer);
                    textChunk += '\n' + decoder.decode(tailBytes);
                }

                if (isVideoFile(file) || file.type.startsWith('audio/') || /\.(mp4|mov|m4a|3gp)$/i.test(file.name)) {
                    foundCreation = parseMp4MvhdDate(headBytes) || (tailBytes ? parseMp4MvhdDate(tailBytes) : null);
                    if (!foundCreator) {
                        if (textChunk.includes('DJI')) foundCreator = 'DJI Camera / Drone';
                        else if (textChunk.includes('IMKH') || textChunk.includes('Hikvision')) foundCreator = 'Hikvision DVR / CCTV';
                        else if (textChunk.includes('DHAV') || textChunk.includes('Dahua')) foundCreator = 'Dahua DVR / CCTV';
                        else if (textChunk.includes('Apple')) foundCreator = 'Apple QuickTime / iOS';
                        else if (textChunk.includes('GoPro')) foundCreator = 'GoPro Camera';
                        else if (textChunk.includes('Android')) foundCreator = 'Android Video Recorder';
                        else if (textChunk.includes('Lavf')) foundCreator = 'FFmpeg / Lavf Encoder';
                    }
                }

                if (!foundCreation) {
                    const xmpDate = textChunk.match(/<(?:xmp:CreateDate|dcterms:created|photoshop:DateCreated)[^>]*>([^<]+)</i);
                    if (xmpDate && xmpDate[1]) {
                        const d = new Date(xmpDate[1].trim());
                        if (!isNaN(d.getTime())) foundCreation = d.toLocaleString('es-MX');
                    }
                }
                if (!foundCreation) {
                    const pdfDate = textChunk.match(/\/CreationDate\s*\(D:(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})(\d{2})/);
                    if (pdfDate) {
                        const d = new Date(
                            parseInt(pdfDate[1], 10),
                            parseInt(pdfDate[2], 10) - 1,
                            parseInt(pdfDate[3], 10),
                            parseInt(pdfDate[4], 10),
                            parseInt(pdfDate[5], 10),
                            parseInt(pdfDate[6], 10)
                        );
                        if (!isNaN(d.getTime())) foundCreation = d.toLocaleString('es-MX');
                    }
                }

                if (!foundCreator) {
                    const xmlCreator = textChunk.match(/<(?:dc:creator|xmp:CreatorTool|cp:lastModifiedBy)[^>]*>([^<]+)</i);
                    if (xmlCreator && xmlCreator[1]) {
                        const cleanCreator = xmlCreator[1].replace(/<[^>]+>/g, '').trim();
                        if (cleanCreator) foundCreator = cleanCreator;
                    }
                }
                if (!foundCreator) {
                    const pdfAuthor = textChunk.match(/\/(?:Author|Creator|Producer)\s*\(([^)]+)\)/);
                    if (pdfAuthor && pdfAuthor[1]) {
                        const cleanPdf = pdfAuthor[1].replace(/[\x00-\x1F]/g, '').trim();
                        if (cleanPdf) foundCreator = cleanPdf;
                    }
                }
            } catch (e) {
                console.warn('Aviso al escanear cabecera:', e);
            }

            if (!foundCreation) {
                foundCreation = parseFilenameCreationDate(file.name) || lastMod;
            }
            if (!foundCreator) {
                foundCreator = osUser || 'Sistema Local / Propietario OS';
            }

            evidenceItem.extraMeta.creationDate = foundCreation;
            evidenceItem.extraMeta.creator = foundCreator;

            if (creationEl) creationEl.innerHTML = `${OFFLINE_ICONS.calendarPlus} <b class="text-purple-100">CREACIÓN:</b> ${foundCreation}`;
            if (creatorEl) creatorEl.innerHTML = `${OFFLINE_ICONS.user} <b class="text-purple-100">CREADOR:</b> ${foundCreator}`;

            if (file.type === 'image/jpeg' || file.type === 'image/tiff' || /\.(jpe?g|tiff?)$/i.test(file.name)) {
                try {
                    EXIF.getData(file, function() {
                        let make = EXIF.getTag(this, "Make") || '';
                        let model = EXIF.getTag(this, "Model") || '';
                        let software = EXIF.getTag(this, "Software") || '';
                        let artist = EXIF.getTag(this, "Artist") || '';
                        let datetime = EXIF.getTag(this, "DateTimeOriginal") || EXIF.getTag(this, "DateTime");

                        let creatorInfo = artist || software;
                        if (make || model) creatorInfo += creatorInfo ? ` (${make} ${model})` : `${make} ${model}`;

                        if (creatorInfo && creatorInfo.trim() !== '') {
                            evidenceItem.extraMeta.creator = creatorInfo.trim();
                            if (creatorEl) creatorEl.innerHTML = `${OFFLINE_ICONS.user} <b class="text-purple-100">CREADOR:</b> ${evidenceItem.extraMeta.creator}`;
                        }

                        if (datetime) {
                            const formattedExif = formatExifDateString(datetime);
                            if (formattedExif) {
                                evidenceItem.extraMeta.creationDate = formattedExif;
                                if (creationEl) creationEl.innerHTML = `${OFFLINE_ICONS.calendarPlus} <b class="text-purple-100">CREACIÓN:</b> ${formattedExif}`;
                            }
                        }
                    });
                } catch (e) {}
            }
        }

        // Lee la duración y resolución mediante elemento HTML5 <video> (incluyendo corrección para duración Infinity)
        function probeHtml5VideoMeta(file) {
            return new Promise((resolve) => {
                const vid = document.createElement('video');
                vid.preload = 'metadata';
                vid.muted = true;
                vid.playsInline = true;
                const objUrl = URL.createObjectURL(file);
                let finished = false;

                const finish = (resVal, durSecVal) => {
                    if (finished) return;
                    finished = true;
                    clearTimeout(timer);
                    vid.removeAttribute('src');
                    try { vid.load(); } catch (e) {}
                    URL.revokeObjectURL(objUrl);
                    resolve({ resolution: resVal, durationSec: durSecVal });
                };

                const timer = setTimeout(() => {
                    const w = vid.videoWidth > 0 ? `${vid.videoWidth}x${vid.videoHeight} px` : null;
                    const d = (vid.duration && isFinite(vid.duration) && vid.duration > 0) ? vid.duration : null;
                    finish(w, d);
                }, 2200);

                vid.onloadedmetadata = () => {
                    const res = (vid.videoWidth > 0 && vid.videoHeight > 0) ? `${vid.videoWidth}x${vid.videoHeight} px` : null;
                    if (vid.duration === Infinity || isNaN(vid.duration)) {
                        // Truco estándar para WebM/MKV/Fragmented MP4 que reportan Infinity al inicio
                        vid.ontimeupdate = () => {
                            vid.ontimeupdate = null;
                            const d = (vid.duration && isFinite(vid.duration) && vid.duration > 0)
                                ? vid.duration
                                : (vid.currentTime > 0 ? vid.currentTime : null);
                            finish(res, d);
                        };
                        try {
                            vid.currentTime = 1e101;
                        } catch (e) {
                            finish(res, null);
                        }
                    } else {
                        const d = (vid.duration > 0 && isFinite(vid.duration)) ? vid.duration : null;
                        finish(res, d);
                    }
                };

                vid.onerror = () => finish(null, null);
                vid.src = objUrl;
            });
        }

        async function extractMediaMetadata(file, cardId, evidenceItem) {
            if (config.modeMetadata) {
                extractUniversalFileMetadata(file, cardId, evidenceItem);
            }

            if (config.modeMetadata && file.type.startsWith('image/')) {

                img.onload = () => {

                    URL.revokeObjectURL(img.src);
                };
                img.onerror = () => {

                    URL.revokeObjectURL(img.src);
                };
                img.src = URL.createObjectURL(file);
            } 
            else if (isVideoFile(file)) {
                const applyVideoMetaToCard = (resText, durText) => {

                    if (durText) evidenceItem.extraMeta.duration = durText;

                    const dimEl = document.getElementById(`meta-dim-${cardId}`);
                    const durEl = document.getElementById(`meta-dur-${cardId}`);
                    const hashDurEl = document.getElementById(`hash-vid-dur-${cardId}`);

                    if (dimEl && resText) {
                        dimEl.innerHTML = `${OFFLINE_ICONS.film} <b class="text-purple-100">RESOLUCIÓN:</b> ${resText}`;
                    }
                    if (durEl && durText) {
                        durEl.innerHTML = `${OFFLINE_ICONS.clock} <b class="text-purple-100">DURACIÓN:</b> ${durText}`;
                    }
                    if (hashDurEl && durText) {
                        hashDurEl.innerHTML = `${OFFLINE_ICONS.clock} ${durText}`;
                    }
                };

                // Ejecutamos en paralelo el inspector binario de cabeceras y el demuxer HTML5 <video>
                const [binaryMeta, html5Meta] = await Promise.all([
                    extractBinaryVideoFallback(file),
                    probeHtml5VideoMeta(file)
                ]);

                const finalRes = html5Meta.resolution || binaryMeta.resolution || 'Codec CCTV / Propietario';
                const finalDurSec = html5Meta.durationSec || binaryMeta.durationSec;
                const finalDurText = finalDurSec ? formatDuration(finalDurSec) : binaryMeta.duration;

                applyVideoMetaToCard(finalRes, finalDurText);
            }
        }

        async function processLargeFile(evidenceItem, cardElement) {
            const file = evidenceItem.file;
            const cardId = cardElement.id;
            
            processedEvidence.push(evidenceItem);
            extractMediaMetadata(file, cardId, evidenceItem);
            
            if (!config.modeHash) return; 

            const progressText = document.getElementById(`progress-${cardId}`);
            const loader = document.getElementById(`loader-${cardId}`);
            
            const chunkSize = 50 * 1024 * 1024;
            const totalChunks = Math.max(1, Math.ceil(file.size / chunkSize));
            let currentChunk = 0;
            
            const spark = new SparkMD5.ArrayBuffer();
            const sha256Algo = sha256.create();
            const sha1Algo = config.sha1 ? sha1.create() : null;
            
            const reader = new FileReader();
            
            reader.onload = function(e) {
                if(!document.getElementById(cardId)) return; 
                const buffer = e.target.result;
                spark.append(buffer);
                sha256Algo.update(buffer);
                if(sha1Algo) sha1Algo.update(buffer);
                
                currentChunk++;
                if (currentChunk < totalChunks) {
                    if (progressText) progressText.innerText = `${Math.round((currentChunk / totalChunks) * 100)}%`;
                    requestAnimationFrame(loadNext);
                } else {
                    evidenceItem.hashes = { md5: spark.end(), sha256: sha256Algo.hex(), sha1: sha1Algo ? sha1Algo.hex() : null };
                    
                    updateHashValue(`md5-${cardId}`, evidenceItem.hashes.md5);
                    updateHashValue(`sha256-${cardId}`, evidenceItem.hashes.sha256);
                    if(config.sha1) updateHashValue(`sha1-${cardId}`, evidenceItem.hashes.sha1);
                    
                    if(config.verifyMode) searchHash(document.getElementById('hash-search').value);
                    if (loader) { loader.style.opacity = '0'; setTimeout(() => loader.remove(), 300); }
                }
            };
            
            reader.onerror = () => { if (loader) loader.innerHTML = `<span class="text-xs font-semibold text-red-200 uppercase tracking-wide">Error de lectura</span>`; };
            function loadNext() { const start = currentChunk * chunkSize; const end = Math.min(start + chunkSize, file.size); reader.readAsArrayBuffer(file.slice(start, end)); }
            loadNext();
        }

        function updateHashValue(id, hashValue) { const el = document.getElementById(id); if(el) el.innerText = hashValue; }

        /* =========================================================
           GENERADOR NATIVO DE EXCEL (.XLSX) CON FORMATO DE TABLA
           100% OFFLINE (ENCABEZADO AZUL, FILTROS Y FILAS ALTERNADAS)
           ========================================================= */
        const CRC32_TABLE = (function() {
            const table = new Uint32Array(256);
            for (let n = 0; n < 256; n++) {
                let c = n;
                for (let k = 0; k < 8; k++) {
                    c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
                }
                table[n] = c >>> 0;
            }
            return table;
        })();

        function crc32Bytes(uint8) {
            let crc = 0xFFFFFFFF;
            for (let i = 0; i < uint8.length; i++) {
                crc = CRC32_TABLE[(crc ^ uint8[i]) & 0xFF] ^ (crc >>> 8);
            }
            return (crc ^ 0xFFFFFFFF) >>> 0;
        }

        function createZipBlob(files) {
            const encoder = new TextEncoder();
            const localParts = [];
            const centralParts = [];
            let offset = 0;

            files.forEach(file => {
                const nameBytes = encoder.encode(file.name);
                const dataBytes = typeof file.content === 'string' ? encoder.encode(file.content) : file.content;
                const crc = crc32Bytes(dataBytes);
                const size = dataBytes.length;

                const localHeader = new Uint8Array(30 + nameBytes.length);
                const lv = new DataView(localHeader.buffer);
                lv.setUint32(0, 0x04034b50, true);
                lv.setUint16(4, 20, true);
                lv.setUint16(6, 0x0800, true);
                lv.setUint16(8, 0, true);
                lv.setUint16(10, 0, true);
                lv.setUint16(12, 0x2100, true);
                lv.setUint32(14, crc, true);
                lv.setUint32(18, size, true);
                lv.setUint32(22, size, true);
                lv.setUint16(26, nameBytes.length, true);
                lv.setUint16(28, 0, true);
                localHeader.set(nameBytes, 30);

                const centralHeader = new Uint8Array(46 + nameBytes.length);
                const cv = new DataView(centralHeader.buffer);
                cv.setUint32(0, 0x02014b50, true);
                cv.setUint16(4, 20, true);
                cv.setUint16(6, 20, true);
                cv.setUint16(8, 0x0800, true);
                cv.setUint16(10, 0, true);
                cv.setUint16(12, 0, true);
                cv.setUint16(14, 0x2100, true);
                cv.setUint32(16, crc, true);
                cv.setUint32(20, size, true);
                cv.setUint32(24, size, true);
                cv.setUint16(28, nameBytes.length, true);
                cv.setUint16(30, 0, true);
                cv.setUint16(32, 0, true);
                cv.setUint16(34, 0, true);
                cv.setUint16(36, 0, true);
                cv.setUint32(38, 0, true);
                cv.setUint32(42, offset, true);
                centralHeader.set(nameBytes, 46);

                localParts.push(localHeader, dataBytes);
                centralParts.push(centralHeader);
                offset += localHeader.length + size;
            });

            let cdSize = 0;
            centralParts.forEach(part => { cdSize += part.length; });

            const eocd = new Uint8Array(22);
            const ev = new DataView(eocd.buffer);
            ev.setUint32(0, 0x06054b50, true);
            ev.setUint16(4, 0, true);
            ev.setUint16(6, 0, true);
            ev.setUint16(8, files.length, true);
            ev.setUint16(10, files.length, true);
            ev.setUint32(12, cdSize, true);
            ev.setUint32(16, offset, true);
            ev.setUint16(20, 0, true);

            return new Blob([...localParts, ...centralParts, eocd], {
                type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
            });
        }

        function escapeXml(str) {
            return String(str ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&apos;');
        }

        function getExcelColName(colIndex) {
            let n = colIndex + 1;
            let name = '';
            while (n > 0) {
                const rem = (n - 1) % 26;
                name = String.fromCharCode(65 + rem) + name;
                n = Math.floor((n - 1) / 26);
            }
            return name;
        }

                        { v: meta.dimensions || 'N/A', t: 's' },
                        { v: vidDur, t: 's' },
                        { v: meta.creator || 'Sistema Local', t: 's' },
                        { v: meta.creationDate || lastMod, t: 's' },
                        { v: lastMod, t: 's' }
                    );
                } else if (config.macTime) {
                    rowData.push({ v: lastMod, t: 's' });
                }
                if (config.modeHash) {
                    rowData.push(
                        { v: h.md5 || 'N/A', t: 's' },
                        { v: h.sha256 || 'N/A', t: 's' }
                    );
                    if (config.sha1) {
                        rowData.push({ v: h.sha1 || 'N/A', t: 's' });
                    }
                }
                return rowData;
            });

            // Tabla de Shared Strings para compatibilidad total con Tablas de Excel
            const sharedStrings = [];
            const sharedStringMap = new Map();
            function getSharedStringIdx(text) {
                const key = String(text ?? '');
                if (sharedStringMap.has(key)) return sharedStringMap.get(key);
                const idx = sharedStrings.length;
                sharedStrings.push(key);
                sharedStringMap.set(key, idx);
                return idx;
            }

            // Calcular el ancho óptimo para cada columna
            const colWidths = headers.map((h, colIdx) => {
                let maxLen = h.length + 4;
                rows.forEach(r => {
                    const valStr = String(r[colIdx].v ?? '');
                    if (valStr.length > maxLen) maxLen = valStr.length;
                });
                return Math.min(Math.max(maxLen + 3, 12), 75);
            });

            const lastColLetter = getExcelColName(headers.length - 1);
            const lastRowNumber = rows.length + 1;
            const tableRef = `A1:${lastColLetter}${lastRowNumber}`;

            // Construcción de filas XML
            let sheetRowsXml = `<row r="1" ht="20" customHeight="1">`;
            headers.forEach((hText, cIdx) => {
                const cellRef = `${getExcelColName(cIdx)}1`;
                const sIdx = getSharedStringIdx(hText);
                sheetRowsXml += `<c r="${cellRef}" s="1" t="s"><v>${sIdx}</v></c>`;
            });
            sheetRowsXml += `</row>`;

            rows.forEach((rCells, rIdx) => {
                const rowNum = rIdx + 2;
                const isOddDataRow = (rIdx % 2 === 0); // Fila 2 azul claro (#DDEBF7), Fila 3 blanca (#FFFFFF)
                sheetRowsXml += `<row r="${rowNum}" ht="18">`;
                rCells.forEach((cell, cIdx) => {
                    const cellRef = `${getExcelColName(cIdx)}${rowNum}`;
                    if (cell.t === 'n') {
                        const styleId = isOddDataRow ? 4 : 5;
                        sheetRowsXml += `<c r="${cellRef}" s="${styleId}"><v>${cell.v}</v></c>`;
                    } else {
                        const styleId = isOddDataRow ? 2 : 3;
                        const sIdx = getSharedStringIdx(cell.v);
                        sheetRowsXml += `<c r="${cellRef}" s="${styleId}" t="s"><v>${sIdx}</v></c>`;
                    }
                });
                sheetRowsXml += `</row>`;
            });

            const colsXml = colWidths.map((w, idx) =>
                `<col min="${idx + 1}" max="${idx + 1}" width="${w}" customWidth="1"/>`
            ).join('');

            const contentTypesXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
  <Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
  <Default Extension="xml" ContentType="application/xml"/>
  <Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>
  <Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>
  <Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>
  <Override PartName="/xl/sharedStrings.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sharedStrings+xml"/>
  <Override PartName="/xl/tables/table1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.table+xml"/>
</Types>`;

            const rootRelsXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>
</Relationships>`;

            const workbookXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">
  <sheets>
    <sheet name="Reporte Forense" sheetId="1" r:id="rId1"/>
  </sheets>
</workbook>`;

            const workbookRelsXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/>
  <Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>
  <Relationship Id="rId3" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/sharedStrings" Target="sharedStrings.xml"/>
</Relationships>`;

            // Estilos exactos: Encabezado azul (#8DB4E2) con letra blanca en negrita centrada, filas alternadas (#DDEBF7 y #FFFFFF) y bordes finos
            const stylesXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
  <fonts count="2">
    <font><sz val="11"/><color rgb="FF000000"/><name val="Calibri"/></font>
    <font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font>
  </fonts>
  <fills count="5">
    <fill><patternFill patternType="none"/></fill>
    <fill><patternFill patternType="gray125"/></fill>
    <fill><patternFill patternType="solid"><fgColor rgb="FF8DB4E2"/><bgColor indexed="64"/></patternFill></fill>
    <fill><patternFill patternType="solid"><fgColor rgb="FFDDEBF7"/><bgColor indexed="64"/></patternFill></fill>
    <fill><patternFill patternType="solid"><fgColor rgb="FFFFFFFF"/><bgColor indexed="64"/></patternFill></fill>
  </fills>
  <borders count="2">
    <border><left/><right/><top/><bottom/><diagonal/></border>
    <border>
      <left style="thin"><color rgb="FF000000"/></left>
      <right style="thin"><color rgb="FF000000"/></right>
      <top style="thin"><color rgb="FF000000"/></top>
      <bottom style="thin"><color rgb="FF000000"/></bottom>
      <diagonal/>
    </border>
  </borders>
  <cellStyleXfs count="1">
    <xf numFmtId="0" fontId="0" fillId="0" borderId="0"/>
  </cellStyleXfs>
  <cellXfs count="6">
    <xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>
    <xf numFmtId="0" fontId="1" fillId="2" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1">
      <alignment horizontal="center" vertical="center"/>
    </xf>
    <xf numFmtId="0" fontId="0" fillId="3" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1">
      <alignment horizontal="left" vertical="center"/>
    </xf>
    <xf numFmtId="0" fontId="0" fillId="4" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1">
      <alignment horizontal="left" vertical="center"/>
    </xf>
    <xf numFmtId="0" fontId="0" fillId="3" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1">
      <alignment horizontal="right" vertical="center"/>
    </xf>
    <xf numFmtId="0" fontId="0" fillId="4" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1">
      <alignment horizontal="right" vertical="center"/>
    </xf>
  </cellXfs>
</styleSheet>`;

            const sharedStringsXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<sst xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" count="${sharedStrings.length}" uniqueCount="${sharedStrings.length}">
  ${sharedStrings.map(s => `<si><t xml:space="preserve">${escapeXml(s)}</t></si>`).join('')}
</sst>`;

            const sheetXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">
  <dimension ref="${tableRef}"/>
  <sheetViews>
    <sheetView tabSelected="1" workbookViewId="0"/>
  </sheetViews>
  <cols>${colsXml}</cols>
  <sheetData>${sheetRowsXml}</sheetData>
  <tableParts count="1">
    <tablePart r:id="rId1"/>
  </tableParts>
</worksheet>`;

            const sheetRelsXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/table" Target="../tables/table1.xml"/>
</Relationships>`;

            const tableColumnsXml = headers.map((h, i) =>
                `<tableColumn id="${i + 1}" name="${escapeXml(h)}"/>`
            ).join('');

            const tableXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<table xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" id="1" name="TablaReporteForense" displayName="TablaReporteForense" ref="${tableRef}" totalsRowShown="0">
  <autoFilter ref="${tableRef}"/>
  <tableColumns count="${headers.length}">${tableColumnsXml}</tableColumns>
  <tableStyleInfo name="TableStyleMedium2" showFirstColumn="0" showLastColumn="0" showRowStripes="1" showColumnStripes="0"/>
</table>`;

            const xlsxBlob = createZipBlob([
                { name: '[Content_Types].xml', content: contentTypesXml },
                { name: '_rels/.rels', content: rootRelsXml },
                { name: 'xl/workbook.xml', content: workbookXml },
                { name: 'xl/_rels/workbook.xml.rels', content: workbookRelsXml },
                { name: 'xl/styles.xml', content: stylesXml },
                { name: 'xl/sharedStrings.xml', content: sharedStringsXml },
                { name: 'xl/worksheets/sheet1.xml', content: sheetXml },
                { name: 'xl/worksheets/_rels/sheet1.xml.rels', content: sheetRelsXml },
                { name: 'xl/tables/table1.xml', content: tableXml }
            ]);

            const link = document.createElement("a");
            link.href = URL.createObjectURL(xlsxBlob);
            link.download = `Reporte_Forense_${Date.now()}.xlsx`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
